[project]
name = "viyugam"
version = "0.6.0"
description = "A personal Life OS — text-only, Claude-powered"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "prompt_toolkit>=3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
viyugam = "viyugam.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viyugam"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "radon>=6.0.0",
    "interrogate>=1.7.0",
    "vulture>=2.13",
    "anybadge>=1.14.0",
    "pytest-cov>=6.0.0",
    "lizard>=1.17.0",
    "types-pyyaml>=6.0.12.20250915",
    "mutmut>=3.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.interrogate]
fail-under = 0
ignore-init-method = true
ignore-magic = true

[tool.vulture]
min_confidence = 80

[tool.coverage.run]
omit = [
    "viyugam/dashboard.py",        # TUI rendering — needs live terminal
    "viyugam/repl.py",             # Interactive REPL — needs prompt_toolkit
    "viyugam/main.py",             # CLI wiring — agents need API key
    "viyugam/agents/boardroom.py", # AI agent — needs API key
    "viyugam/agents/chairman.py",
    "viyugam/agents/coach.py",
    "viyugam/agents/finance.py",
    "viyugam/agents/goal_planner.py",
    "viyugam/agents/intent.py",
    "viyugam/agents/project_planner.py",
    "viyugam/agents/researcher.py",
    "viyugam/agents/reviewer.py",
    "viyugam/agents/socratic.py",
    "viyugam/agents/triage_agent.py",
    "viyugam/agents/_api.py",      # Compatibility shim
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.bandit]
targets = ["viyugam"]
skips = ["B101"]
