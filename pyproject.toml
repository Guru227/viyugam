[project]
name = "viyugam"
version = "0.6.0"
description = "A personal Life OS — text-only, Claude-powered"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "prompt_toolkit>=3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
viyugam = "viyugam.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viyugam"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "radon>=6.0.0",
    "interrogate>=1.7.0",
    "vulture>=2.13",
    "anybadge>=1.14.0",
    "pytest-cov>=6.0.0",
    "lizard>=1.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.interrogate]
fail-under = 0
ignore-init-method = true
ignore-magic = true

[tool.vulture]
min_confidence = 80

[tool.bandit]
targets = ["viyugam"]
skips = ["B101"]
